# Redirect HTTP (8080) to HTTPS (8443)
server {
    listen 8080;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

# Main HTTPS Server
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    # 1. Frontend: Serve Angular static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Auth Service -> Spring Gateway
    location /api/auth {
        proxy_pass https://gateway:8089/api/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    # 3. Product Service -> Spring Gateway
    location /api/products {
        client_max_body_size 20M;
        proxy_pass https://gateway:8089/api/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    # 4. Media Service API -> Spring Gateway
    location /api/media {
        client_max_body_size 20M;
        proxy_pass https://gateway:8089/api/media;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }

    # 5. Serve Uploaded Images -> Spring Gateway
    location /api/uploads {
        proxy_pass https://gateway:8089/api/uploads;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
    }
}