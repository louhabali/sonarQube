
networks:
  ci_net:
    driver: bridge

volumes:
  jenkins_home:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

services:
  # --- JENKINS SERVICE 
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    user: root
    restart: always
    ports:
      - "8090:8080"   
      - "50000:50000"
    env_file:
      - ../.env
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      # --- disable the setup wizard
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      # --- ENVIRONMENT VARIABLES FOR GROOVY INIT ---
    volumes:
      - jenkins_home:/var/jenkins_home
      #- /var/run/docker.sock:/var/run/docker.sock
      - /run/user/${UID}/docker.sock:/var/run/docker.sock
    networks:
      - ci_net

  # --- SONARQUBE DATABASE 
  sonar_db:
    image: postgres:15-alpine
    container_name: sonar_db
    restart: always
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=alouhabsonar
      - POSTGRES_DB=sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - ci_net

  # --- SONARQUBE SERVICE ---
  sonarqube:
    build:
      context: ./sonarqube
      dockerfile: Dockerfile
    container_name: sonarqube
    restart: always
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=alouhabsonar
      - SONAR_JDBC_URL=jdbc:postgresql://sonar_db:5432/sonarqube
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar_db
    networks:
      - ci_net